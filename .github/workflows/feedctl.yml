# Tests the rules and feedctl on every push and PR. On main, publishes the feedctl image
# (rules and feed list included) to ghcr.io/<owner>/asnews-feedctl for amd64 and arm64.
# The Pi picks it up with `docker compose pull && docker compose up -d --force-recreate`.
name: feedctl

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./tools/feedctl check
      - name: compose config
        working-directory: deploy
        env:
          POSTGRES_PASSWORD: ci
          MINIFLUX_ADMIN_PASSWORD: ci
          MINIFLUX_BASE_URL: https://asnews.lan/
        run: |
          docker compose config --quiet
          docker compose --profile rsshub config --quiet

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/asnews-feedctl
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
