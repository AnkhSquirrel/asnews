# asnews stack for the Raspberry Pi 4 (8 GB, Raspberry Pi OS, aarch64).
# Only this file and .env are needed on the Pi; no repo checkout.
#   cp .env.example .env && edit .env
#   docker compose pull && docker compose up -d --force-recreate   # Miniflux + Postgres + feedctl apply
#   docker compose --profile rsshub up -d    # + RSSHub (feeds for sites without RSS)
#   docker compose logs feedctl              # what the last apply did
#   docker compose run --rm --no-deps feedctl probe     # are the feed URLs alive?
#   docker compose run --rm --no-deps feedctl check -v  # rules vs cases, per case
#
# Rules and the feed list ship inside the feedctl image, built from main by CI. To change them,
# commit and push, wait for CI, then pull and up again here.
#
# Runs next to the existing network-core stack and uses its nginx and dnsmasq; start that first.
# No host ports: Miniflux joins network-core's external Docker network `proxy` and the `nginx`
# container proxies to http://asnews-miniflux:8080 (see nginx-asnews.conf.example).
# Postgres and RSSHub stay on this stack's private default network.
# No VPN: never use network-core's wireguard (no network_mode: service:wireguard).
#
# Images: miniflux/miniflux publishes amd64, arm64, arm/v7, arm/v6.
# RSSHub on arm/arm64 ships without puppeteer: routes that need a headless browser fail.

name: asnews

services:
  miniflux:
    image: miniflux/miniflux:${MINIFLUX_VERSION:-2.3.3}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      proxy:
        # Unique name on the shared network; nginx's upstream.
        aliases:
          - asnews-miniflux
    environment:
      DATABASE_URL: postgres://miniflux:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      # Creates the admin only if it does not exist yet.
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:?set MINIFLUX_ADMIN_PASSWORD in .env}
      # Public URL served by network-core's nginx.
      BASE_URL: ${MINIFLUX_BASE_URL:?set MINIFLUX_BASE_URL in .env}
      # Minutes between feed refresh cycles (Miniflux default: 60).
      POLLING_FREQUENCY: ${MINIFLUX_POLLING_FREQUENCY:-30}
      # Keep the database small: it lives on the Pi's SD card.
      CLEANUP_ARCHIVE_READ_DAYS: "30"
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # One-shot: on every `up`, pushes the rules and feed list baked into the image to Miniflux,
  # then exits. Talks to Miniflux over this stack's private network; never joins `proxy`.
  feedctl:
    image: ${FEEDCTL_IMAGE:-ghcr.io/ankhsquirrel/asnews-feedctl:latest}
    restart: "no"
    depends_on:
      miniflux:
        condition: service_healthy
    # FEEDCTL_APPLY_FLAGS=-dry-run prints the plan without changing anything.
    command: apply ${FEEDCTL_APPLY_FLAGS:-}
    environment:
      MINIFLUX_URL: http://miniflux:8080
      # Basic auth with the admin account; MINIFLUX_TOKEN (an API key) takes precedence if set.
      MINIFLUX_USERNAME: ${MINIFLUX_ADMIN_USERNAME:-admin}
      MINIFLUX_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:?set MINIFLUX_ADMIN_PASSWORD in .env}
      MINIFLUX_TOKEN: ${MINIFLUX_TOKEN:-}

  db:
    # Postgres 18 stores data under /var/lib/postgresql (<=17 used .../data).
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: miniflux
    volumes:
      - miniflux-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s

  rsshub:
    profiles: ["rsshub"]
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_EXPIRE: "3600"
    # Not published on the host: subscribe in Miniflux as http://rsshub:1200/<route>
    expose:
      - "1200"

networks:
  proxy:
    # Created once on the Pi (`docker network create proxy`) and shared with network-core.
    external: true

volumes:
  miniflux-db:
